name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Provide placeholder secrets config
        run: cp Ghost/Resources/Config/Secrets.xcconfig.example Ghost/Resources/Config/Secrets.xcconfig

      - name: Build
        run: |
          xcodebuild -project Ghost.xcodeproj -scheme Ghost \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation clean build | xcpretty && exit ${PIPESTATUS[0]}

      - name: Test
        run: |
          xcodebuild -project Ghost.xcodeproj -scheme Ghost \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skipMacroValidation test | xcpretty && exit ${PIPESTATUS[0]}

  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint --strict
