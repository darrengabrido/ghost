name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # NOTE: pinned to macos-15 deliberately. `macos-26` is not a valid
        # runner label for this account — jobs are rejected before they are
        # created, which reads as an instant failure with no logs at all.
        run: ./scripts/select-xcode.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Provide placeholder secrets config
        run: cp Ghost/Resources/Config/Secrets.xcconfig.example Ghost/Resources/Config/Secrets.xcconfig

      - name: Build
        run: |
          set -o pipefail
          # The diagnostics have to be echoed on the *failure* path. Running
          # the grep as a following line only ever reported on success, so a
          # broken build surfaced as "3 failures" with the two actual error
          # lines buried in ~1000 lines of SwiftCompile noise.
          if ! xcodebuild -project Ghost.xcodeproj -scheme Ghost \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation clean build 2>&1 | tee "$RUNNER_TEMP/xcodebuild-build.log"; then
            echo "::group::Compiler diagnostics"
            grep -E "error:|warning:" "$RUNNER_TEMP/xcodebuild-build.log" || echo "(no diagnostic lines found)"
            echo "::endgroup::"
            exit 1
          fi
          grep -E "error:|warning:" "$RUNNER_TEMP/xcodebuild-build.log" || true

      - name: Test
        env:
          # Kept in `env:` rather than inline in `run:` on purpose. A heredoc
          # whose body sits at column 0 terminates the enclosing YAML block
          # scalar, which makes the whole workflow file unparseable — that is
          # exactly what commit 33afcdd introduced, and why every run from
          # then until now produced zero jobs and no logs. A block scalar
          # under `env:` is indented with the document, and YAML strips that
          # indentation before Python ever sees it.
          SELECT_DEVICE: |
            import json, sys

            groups = json.load(sys.stdin).get("devices", {}).values()
            names = [
                device["name"]
                for group in groups
                for device in group
                if device.get("isAvailable") and "iPhone" in device.get("name", "")
            ]
            preferred = ("iPhone 17", "iPhone 16", "iPhone")
            print(next(
                (name for prefix in preferred for name in names if name.startswith(prefix)),
                names[0] if names else "iPhone 16",
            ))
        run: |
          set -o pipefail
          DEVICE_NAME=$(xcrun simctl list devices available -j | python3 -c "$SELECT_DEVICE")
          echo "Testing on ${DEVICE_NAME}"
          if ! xcodebuild -project Ghost.xcodeproj -scheme Ghost \
            -destination "platform=iOS Simulator,name=${DEVICE_NAME}" \
            -skipMacroValidation test 2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"; then
            echo "::group::Test failures"
            grep -E "error:|Test Case .* failed|\*\* TEST .* \*\*" "$RUNNER_TEMP/xcodebuild-test.log" \
              | sort -u || echo "(none found)"
            echo "::endgroup::"
            exit 1
          fi

  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint --strict

  screenshots:
    # The reason this job exists: Ghost is an atmospheric app, the repo's PR
    # template requires recordings for any UI change, and the redesign was
    # authored on Linux where no simulator can run. This is the only way a
    # frame of it gets rendered at all.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: ./scripts/select-xcode.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Provide placeholder secrets config
        run: cp Ghost/Resources/Config/Secrets.xcconfig.example Ghost/Resources/Config/Secrets.xcconfig

      - name: Capture screens on iPhone 17 Pro Max
        run: |
          set -o pipefail
          DEVICE="iPhone 17 Pro Max"
          if ! xcrun simctl list devices available | grep -q "${DEVICE}"; then
            echo "::error::No '${DEVICE}' simulator on this runner. Available iPhones:"
            xcrun simctl list devices available | grep iPhone || true
            exit 1
          fi
          if ! xcodebuild -project Ghost.xcodeproj -scheme Ghost \
            -destination "platform=iOS Simulator,name=${DEVICE}" \
            -only-testing:GhostUITests/ScreenshotTests \
            -resultBundlePath "$RUNNER_TEMP/Screens.xcresult" \
            -skipMacroValidation test 2>&1 | tee "$RUNNER_TEMP/screens.log"; then
            echo "::group::Failures"
            grep -E "error:|Test Case .* failed|\*\* TEST .* \*\*" "$RUNNER_TEMP/screens.log" \
              | sort -u || echo "(none found)"
            echo "::endgroup::"
            exit 1
          fi

      - name: Export screenshots
        run: |
          mkdir -p screenshots
          # Falls back to shipping the raw result bundle if the export CLI
          # shape differs — better a bundle the user can open than no artifact.
          if ! xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/Screens.xcresult" \
            --output-path screenshots; then
            echo "::warning::Attachment export failed; uploading the raw .xcresult instead."
            cp -R "$RUNNER_TEMP/Screens.xcresult" screenshots/
          fi
          ls -lR screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: ghost-screens-iphone-17-pro-max
          path: screenshots
          if-no-files-found: error
