name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Available Xcodes:"
          ls /Applications | grep -i Xcode || true
          # Pick by *version*, not by name. `ls | sort | tail -1` looks right
          # and is not: the runner carries both Xcode_26.3.app and a bare
          # Xcode.app, and locale collation ignores punctuation, so
          # "Xcode.app" sorts after "Xcode_26.3.app" and wins. That silently
          # selected Xcode 16.4 (iOS 18.5 SDK) on a machine that had 26.3.
          XCODE_APP=""
          BEST_VERSION=""
          for app in /Applications/Xcode*.app; do
            version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
              "${app}/Contents/Info.plist" 2>/dev/null) || continue
            if [ -z "${BEST_VERSION}" ] || \
               [ "$(printf '%s\n%s\n' "${BEST_VERSION}" "${version}" | sort -V | tail -1)" = "${version}" ]; then
              BEST_VERSION="${version}"
              XCODE_APP="${app}"
            fi
          done
          echo "Using ${XCODE_APP} (Xcode ${BEST_VERSION})"
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes
          # Ghost targets iOS 26; without that SDK every Liquid Glass
          # symbol fails to resolve and the log is unreadable. Say so here.
          # NOTE: pinned to macos-15 deliberately. `macos-26` is not a valid
          # runner label for this account — jobs are rejected before they
          # are created, which reads as an instant failure with no logs at
          # all. Revisit only once that label is confirmed available.
          if ! xcodebuild -showsdks | grep -qE "iphoneos(2[6-9]|[3-9][0-9])"; then
            echo "::error::No iOS 26+ SDK on this runner. Ghost's deployment target is iOS 26.0."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Provide placeholder secrets config
        run: cp Ghost/Resources/Config/Secrets.xcconfig.example Ghost/Resources/Config/Secrets.xcconfig

      - name: Build
        run: |
          set -o pipefail
          # The diagnostics have to be echoed on the *failure* path. Running
          # the grep as a following line only ever reported on success, so a
          # broken build surfaced as "3 failures" with the two actual error
          # lines buried in ~1000 lines of SwiftCompile noise.
          if ! xcodebuild -project Ghost.xcodeproj -scheme Ghost \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation clean build 2>&1 | tee "$RUNNER_TEMP/xcodebuild-build.log"; then
            echo "::group::Compiler diagnostics"
            grep -E "error:|warning:" "$RUNNER_TEMP/xcodebuild-build.log" || echo "(no diagnostic lines found)"
            echo "::endgroup::"
            exit 1
          fi
          grep -E "error:|warning:" "$RUNNER_TEMP/xcodebuild-build.log" || true

      - name: Test
        env:
          # Kept in `env:` rather than inline in `run:` on purpose. A heredoc
          # whose body sits at column 0 terminates the enclosing YAML block
          # scalar, which makes the whole workflow file unparseable — that is
          # exactly what commit 33afcdd introduced, and why every run from
          # then until now produced zero jobs and no logs. A block scalar
          # under `env:` is indented with the document, and YAML strips that
          # indentation before Python ever sees it.
          SELECT_DEVICE: |
            import json, sys

            groups = json.load(sys.stdin).get("devices", {}).values()
            names = [
                device["name"]
                for group in groups
                for device in group
                if device.get("isAvailable") and "iPhone" in device.get("name", "")
            ]
            preferred = ("iPhone 17", "iPhone 16", "iPhone")
            print(next(
                (name for prefix in preferred for name in names if name.startswith(prefix)),
                names[0] if names else "iPhone 16",
            ))
        run: |
          set -o pipefail
          DEVICE_NAME=$(xcrun simctl list devices available -j | python3 -c "$SELECT_DEVICE")
          echo "Testing on ${DEVICE_NAME}"
          if ! xcodebuild -project Ghost.xcodeproj -scheme Ghost \
            -destination "platform=iOS Simulator,name=${DEVICE_NAME}" \
            -skipMacroValidation test 2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"; then
            echo "::group::Test failures"
            grep -E "error:|failed|XCTAssert|Test Case .* failed" "$RUNNER_TEMP/xcodebuild-test.log" || echo "(none found)"
            echo "::endgroup::"
            exit 1
          fi

  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint --strict
