name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Available Xcodes:"
          ls /Applications | grep -i Xcode || true
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -1)
          echo "Using ${XCODE_APP}"
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes
          # Ghost targets iOS 26; without that SDK every Liquid Glass
          # symbol fails to resolve and the log is unreadable. Say so here.
          if ! xcodebuild -showsdks | grep -qE "iphoneos(2[6-9]|[3-9][0-9])"; then
            echo "::error::No iOS 26+ SDK on this runner. Ghost's deployment target is iOS 26.0."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Provide placeholder secrets config
        run: cp Ghost/Resources/Config/Secrets.xcconfig.example Ghost/Resources/Config/Secrets.xcconfig

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Ghost.xcodeproj -scheme Ghost \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation clean build 2>&1 | tee "$RUNNER_TEMP/xcodebuild-build.log"
          grep -E "error:|warning:" "$RUNNER_TEMP/xcodebuild-build.log" || true

      - name: Test
        run: |
          set -o pipefail
          DEVICE_NAME=$(python3 - <<'PY'
import json, subprocess
data = json.loads(subprocess.check_output(
    ["xcrun", "simctl", "list", "devices", "available", "-j"]
))
preferred = ("iPhone 17", "iPhone 16", "iPhone")
found = []
for devices in data.get("devices", {}).values():
    for device in devices:
        if device.get("isAvailable") and "iPhone" in device.get("name", ""):
            found.append(device["name"])
for name in preferred:
    for candidate in found:
        if candidate.startswith(name):
            print(candidate)
            raise SystemExit
print(found[0] if found else "iPhone 16")
PY
          )
          echo "Testing on ${DEVICE_NAME}"
          xcodebuild -project Ghost.xcodeproj -scheme Ghost \
            -destination "platform=iOS Simulator,name=${DEVICE_NAME}" \
            -skipMacroValidation test 2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"

  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint --strict
