name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Available Xcodes:"
          ls /Applications | grep -i Xcode || true
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -1)
          echo "Using ${XCODE_APP}"
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes
          # Ghost targets iOS 26; without that SDK every Liquid Glass
          # symbol fails to resolve and the log is unreadable. Say so here.
          # NOTE: pinned to macos-15 deliberately. `macos-26` is not a valid
          # runner label for this account — jobs are rejected before they
          # are created, which reads as an instant failure with no logs at
          # all. Revisit only once that label is confirmed available.
          if ! xcodebuild -showsdks | grep -qE "iphoneos(2[6-9]|[3-9][0-9])"; then
            echo "::error::No iOS 26+ SDK on this runner. Ghost's deployment target is iOS 26.0."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Provide placeholder secrets config
        run: cp Ghost/Resources/Config/Secrets.xcconfig.example Ghost/Resources/Config/Secrets.xcconfig

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Ghost.xcodeproj -scheme Ghost \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation clean build 2>&1 | tee "$RUNNER_TEMP/xcodebuild-build.log"
          grep -E "error:|warning:" "$RUNNER_TEMP/xcodebuild-build.log" || true

      - name: Test
        env:
          # Kept in `env:` rather than inline in `run:` on purpose. A heredoc
          # whose body sits at column 0 terminates the enclosing YAML block
          # scalar, which makes the whole workflow file unparseable — that is
          # exactly what commit 33afcdd introduced, and why every run from
          # then until now produced zero jobs and no logs. A block scalar
          # under `env:` is indented with the document, and YAML strips that
          # indentation before Python ever sees it.
          SELECT_DEVICE: |
            import json, sys

            groups = json.load(sys.stdin).get("devices", {}).values()
            names = [
                device["name"]
                for group in groups
                for device in group
                if device.get("isAvailable") and "iPhone" in device.get("name", "")
            ]
            preferred = ("iPhone 17", "iPhone 16", "iPhone")
            print(next(
                (name for prefix in preferred for name in names if name.startswith(prefix)),
                names[0] if names else "iPhone 16",
            ))
        run: |
          set -o pipefail
          DEVICE_NAME=$(xcrun simctl list devices available -j | python3 -c "$SELECT_DEVICE")
          echo "Testing on ${DEVICE_NAME}"
          xcodebuild -project Ghost.xcodeproj -scheme Ghost \
            -destination "platform=iOS Simulator,name=${DEVICE_NAME}" \
            -skipMacroValidation test 2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"

  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint --strict
