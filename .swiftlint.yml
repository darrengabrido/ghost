excluded:
  - Ghost.xcodeproj
  - DerivedData
  - .build

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - redundant_type_annotation
  - sorted_imports
  - unused_import

disabled_rules:
  - todo
  - line_length

identifier_name:
  min_length: 2
  excluded:
    - id
    - x
    - y

type_name:
  min_length: 3

line_length:
  warning: 140
  error: 200

function_body_length:
  warning: 60
  error: 100
