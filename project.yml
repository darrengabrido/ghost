name: Ghost
options:
  bundleIdPrefix: com.ghost.app
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

configs:
  Debug: debug
  Release: release

targets:
  Ghost:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Ghost
        excludes:
          - Resources/Config
          - Resources/Info.plist
          - Resources/Ghost.entitlements
    dependencies:
      - sdk: HealthKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghost.app
        INFOPLIST_FILE: Ghost/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Ghost/Resources/Ghost.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          xcconfig: Ghost/Resources/Config/Debug.xcconfig
        Release:
          xcconfig: Ghost/Resources/Config/Release.xcconfig

  GhostTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: GhostTests
    dependencies:
      - target: Ghost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  GhostUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: GhostUITests
    dependencies:
      - target: Ghost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Ghost:
    build:
      targets:
        Ghost: all
        GhostTests: [test]
        GhostUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GhostTests
        - GhostUITests
    profile:
      config: Release
    archive:
      config: Release
